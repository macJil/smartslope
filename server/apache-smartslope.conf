# Add this file to MAMP Apache with an Include directive, then restart Apache.
# Change the path in both blocks if your project is in a different document root.
<Directory "/Applications/MAMP/htdocs/smartslope">
    AllowOverride None
    Options -Indexes
    <FilesMatch "(?i)^(\..*|config\.php|functions\.php|.*\.(?:sql|patch|log|md|sh|conf))$">
        Require all denied
    </FilesMatch>
</Directory>

<DirectoryMatch "^/Applications/MAMP/htdocs/smartslope/(?:includes|partials|data|database|scripts|tests|docs|server|\.[^/]+)(?:/|$)">
    Require all denied
</DirectoryMatch>
